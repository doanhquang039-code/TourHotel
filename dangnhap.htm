<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: rgb(219, 222, 222);
      }
      form {
        width: 100%;
        max-width: 400px;
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin: auto;
        margin-top: 210px;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        font-weight: bold;
        display: flex;
        margin-bottom: 5px;
      }
      .form-group input {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }
      .error {
        color: red;
        font-size: 13px;
      }
      .success {
        color: green;
        font-size: 15px;
        text-align: center;
        margin-top: 10px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        font-size: 16px;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <form id="login-form" onsubmit="return loginUser()">
      <h2>Đăng Nhập</h2>
      <div class="form-group">
        <label for="login-username">Tài khoản:</label>
        <input type="text" id="login-username" required />
      </div>
      <div class="form-group">
        <label for="login-password">Mật khẩu:</label>
        <input type="password" id="login-password" required />
      </div>
      <div id="login-error" class="error"></div>
      <div id="login-success" class="success"></div>
      <button type="submit">Đăng nhập</button>
    </form>

    <div style="text-align: center">
      <a style="text-decoration: none; font-size: 25px" href="dangky.htm"
        >Bạn chưa có tài khoản?</a
      >
    </div>

    <script>
      function loginUser() {
        const usernameInput = document
          .getElementById("login-username")
          .value.trim();
        const passwordInput = document
          .getElementById("login-password")
          .value.trim();
        const errorDiv = document.getElementById("login-error");
        const successDiv = document.getElementById("login-success");

        errorDiv.innerText = "";
        successDiv.innerText = "";

        const storedAccount = JSON.parse(localStorage.getItem("userAccount"));

        if (
          storedAccount &&
          storedAccount.username === usernameInput &&
          storedAccount.password === passwordInput
        ) {
          sessionStorage.setItem("isLoggedIn", "true");
          sessionStorage.setItem("userDetails", JSON.stringify(storedAccount));

          successDiv.innerText = "đăng nhập thành công";
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        } else {
          errorDiv.innerText = "Tài khoản hoặc mật khẩu không chính xác!";
        }
        return false;
      }
    </script>
  </body>
</html>
